<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Skill by ticker: direct beats recursive on all eight</title>
<desc id="dsc">Grouped horizontal bars of skill versus the naive yesterday baseline for eight tickers. Direct ranges from +6.8% on NVDA to -95.3% on JPM; recursive ranges from -105.7% to -1039.0%. Direct beats recursive on every ticker.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
.t{fill:#E6EDF3;}
.s{fill:#8B949E;}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;}
.surf{fill:#0D1117;}
.panel{fill:#151B23;stroke:#30363D;}
.hair{stroke:#21262D;}
.zero{stroke:#6E7681;stroke-dasharray:3 4;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-40}}
.bar{animation:grow .8s cubic-bezier(.22,1,.36,1) backwards;transform-box:fill-box;transform-origin:var(--o,left center)}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.sweep{animation:sweep 1.1s cubic-bezier(.22,1,.36,1) backwards}@keyframes sweep{from{stroke-dashoffset:var(--full)}to{stroke-dashoffset:var(--rest)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="surf" width="1000" height="470" rx="14"/>
<text class="t" x="24" y="34" font-size="16" font-weight="600">Skill vs the naive baseline, per ticker</text>
<text class="s" x="24" y="54" font-size="12">Positive = beats yesterday&#39;s guess. Recomputed from the raw per-window CSVs. Axis clipped at &#8722;300%; <tspan fill="#8B949E">&#966;</tspan> marks a bar that continues past it.</text>
