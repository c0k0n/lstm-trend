<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" width="760" height="176" role="img" aria-label="How the downloaded history is split into training, validation and test windows">
  <defs>
    <style>
      .bg   { fill: #0E1117; }
      .lbl  { fill: #F0F2F6; font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .sub  { fill: #9AA1AD; font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .cap  { fill: #9AA1AD; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .pct  { fill: #0E1117; font: 700 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="176" rx="12"/>

  <text class="lbl" x="28" y="30">One timeline, three windows</text>
  <text class="sub" x="28" y="48">Oldest close on the left, most recent on the right. Nothing ever crosses the boundary.</text>

  <!-- Track -->
  <rect x="28" y="66" width="704" height="46" rx="8" fill="#161B24"/>

  <!-- Train: 72% of 704 = 506.9 -->
  <rect x="28" y="66" width="0" height="46" rx="8" fill="#4FB477">
    <animate attributeName="width" from="0" to="507" dur="1.1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text class="pct" x="48" y="94" opacity="0">
    72% train
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- Validation: 8% of 704 = 56.3 -->
  <rect x="535" y="66" width="0" height="46" fill="#FFA726">
    <animate attributeName="width" from="0" to="56" dur="0.5s" begin="1.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>

  <!-- Test: 20% of 704 = 140.8 -->
  <rect x="591" y="66" width="0" height="46" rx="8" fill="#64B5F6">
    <animate attributeName="width" from="0" to="141" dur="0.7s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text class="pct" x="605" y="94" opacity="0">
    20% test
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Divider marks -->
  <line x1="535" y1="62" x2="535" y2="116" stroke="#0E1117" stroke-width="2"/>
  <line x1="591" y1="62" x2="591" y2="116" stroke="#0E1117" stroke-width="2"/>

  <!-- Legend -->
  <rect x="28"  y="128" width="9" height="9" rx="2" fill="#4FB477"/>
  <text class="cap" x="43"  y="137">train — the model learns here</text>

  <rect x="255" y="128" width="9" height="9" rx="2" fill="#FFA726"/>
  <text class="cap" x="270" y="137">validation — early stopping watches this</text>

  <rect x="535" y="128" width="9" height="9" rx="2" fill="#64B5F6"/>
  <text class="cap" x="550" y="137">test — every headline metric comes from here</text>

  <text class="sub" x="28" y="160">The LSTM never sees the test window during training, which is the only reason the RMSE means anything.</text>
</svg>
