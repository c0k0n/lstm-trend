<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-label="Inside one LSTM cell: the incoming cell state and the concatenated input enter on the left, four parallel gate branches read both, the state line multiplies by the forget gate and adds the gated candidate to produce the new state, which is squashed and multiplied by the output gate to give the hidden state, and loops back as the next step's state. All six equations are listed on the right." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Inside one LSTM cell</title>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64B5F6"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EF5350"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFA726"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CE93D8"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4FB477"/></marker>
</defs>

<rect width="1040" height="440" fill="#0E1117"/>
<rect x="0" y="0" width="1040" height="440" fill="none" stroke="#232A36" stroke-width="1"/>

<text x="28" y="34" font-size="17" fill="#E8EAF0" text-anchor="start" font-weight="700">Inside one LSTM cell</text>
<text x="28" y="55" font-size="12" fill="#AEB6C6" text-anchor="start" font-weight="400">One time step. The four branches read the same inputs and are computed in parallel — the vertical order is for reading, not dependency.</text>

<!-- ===== connectors, drawn first so nodes sit cleanly on top ===== -->
<!-- input bus into the spine, then the spine fanning out to the four gates -->
<line x1="140" y1="268" x2="170" y2="268" stroke="#AEB6C6" stroke-width="1.5"/>
<path d="M 170 166 V 370" stroke="#AEB6C6" stroke-width="1.2" fill="none"/>
<circle cx="170" cy="268" r="3" fill="#AEB6C6"/>
<line x1="170" y1="166" x2="206" y2="166" stroke="#EF5350" stroke-width="1.5" marker-end="url(#mr)"/>
<line x1="170" y1="234" x2="206" y2="234" stroke="#64B5F6" stroke-width="1.5" marker-end="url(#mb)"/>
<line x1="170" y1="302" x2="206" y2="302" stroke="#FFA726" stroke-width="1.5" marker-end="url(#mo)"/>
<line x1="170" y1="370" x2="206" y2="370" stroke="#CE93D8" stroke-width="1.5" marker-end="url(#mp)"/>

<!-- the state line: c(t-1) -> x forget -> + -> c(t) -->
<line x1="140" y1="96" x2="196" y2="96" stroke="#4FB477" stroke-width="1.7" marker-end="url(#mg)"/>
<line x1="250" y1="143" x2="250" y2="118" stroke="#EF5350" stroke-width="1.5" marker-end="url(#mr)"/>
<line x1="316" y1="96" x2="427" y2="96" stroke="#4FB477" stroke-width="1.7" marker-end="url(#mg)"/>
<path d="M 358 234 H 372 V 260 H 380" stroke="#64B5F6" stroke-width="1.5" fill="none" marker-end="url(#mb)"/>
<path d="M 358 302 H 372 V 276 H 380" stroke="#FFA726" stroke-width="1.5" fill="none" marker-end="url(#mo)"/>
<line x1="440" y1="246" x2="440" y2="109" stroke="#FFA726" stroke-width="1.7" marker-end="url(#mo)"/>
<line x1="453" y1="96" x2="470" y2="96" stroke="#4FB477" stroke-width="1.7" marker-end="url(#mg)"/>

<!-- the output path: c(t) -> tanh -> x output gate -> h(t) -->
<line x1="520" y1="118" x2="520" y2="156" stroke="#4FB477" stroke-width="1.7" marker-end="url(#mg)"/>
<line x1="520" y1="196" x2="520" y2="347" stroke="#4FB477" stroke-width="1.7" marker-end="url(#mg)"/>
<line x1="358" y1="370" x2="400" y2="370" stroke="#CE93D8" stroke-width="1.5" marker-end="url(#mp)"/>
<line x1="580" y1="370" x2="620" y2="370" stroke="#CE93D8" stroke-width="1.7" marker-end="url(#mp)"/>

<!-- c(t) wraps around to become the next step's c(t-1) -->
<path d="M 570 96 H 750 V 416 H 16 V 96 H 28" stroke="#4FB477" stroke-width="1.6" fill="none" stroke-dasharray="7 5" marker-end="url(#mg)"/>
<text x="383" y="408" font-size="11" fill="#4FB477" text-anchor="middle" font-weight="400">c(t) becomes c(t-1) at the next step</text>

<!-- ===== nodes ===== -->
<!-- incoming cell state -->
<rect x="28" y="74" width="112" height="44" rx="8" fill="#0E1117" stroke="#4FB477" stroke-width="2"/>
<text x="84" y="95" font-size="14" fill="#E8EAF0" text-anchor="middle" font-weight="700">c(t-1)</text>
<text x="84" y="111" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">state in</text>

<!-- the shared input bus -->
<rect x="28" y="241" width="112" height="54" rx="8" fill="#0E1117" stroke="#AEB6C6" stroke-width="1.8"/>
<text x="84" y="265" font-size="12" fill="#E8EAF0" text-anchor="middle" font-weight="600">[h(t-1), x(t)]</text>
<text x="84" y="281" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">hidden + input</text>

<!-- the four gates -->
<rect x="206" y="143" width="152" height="46" rx="8" fill="#0E1117" stroke="#EF5350" stroke-width="1.8"/>
<text x="282" y="164" font-size="12.5" fill="#E8EAF0" text-anchor="middle" font-weight="600">forget gate f(t)</text>
<text x="282" y="182" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">what to drop</text>

<rect x="206" y="211" width="152" height="46" rx="8" fill="#0E1117" stroke="#64B5F6" stroke-width="1.8"/>
<text x="282" y="232" font-size="12.5" fill="#E8EAF0" text-anchor="middle" font-weight="600">input gate i(t)</text>
<text x="282" y="250" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">how much to accept</text>

<rect x="206" y="279" width="152" height="46" rx="8" fill="#0E1117" stroke="#FFA726" stroke-width="1.8"/>
<text x="282" y="300" font-size="12.5" fill="#E8EAF0" text-anchor="middle" font-weight="600">candidate g(t)</text>
<text x="282" y="318" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">what could be written</text>

<rect x="206" y="347" width="152" height="46" rx="8" fill="#0E1117" stroke="#CE93D8" stroke-width="1.8"/>
<text x="282" y="368" font-size="12.5" fill="#E8EAF0" text-anchor="middle" font-weight="600">output gate o(t)</text>
<text x="282" y="386" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">how much to expose</text>

<!-- f(t) x c(t-1): the part of the old state that survives -->
<rect x="196" y="74" width="120" height="44" rx="8" fill="#0E1117" stroke="#EF5350" stroke-width="1.6"/>
<text x="256" y="95" font-size="12" fill="#E8EAF0" text-anchor="middle" font-weight="600">f(t) × c(t-1)</text>
<text x="256" y="111" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">what is kept</text>

<!-- i(t) x g(t): the new content that gets in -->
<rect x="380" y="246" width="120" height="44" rx="8" fill="#0E1117" stroke="#FFA726" stroke-width="1.6"/>
<text x="440" y="267" font-size="12" fill="#E8EAF0" text-anchor="middle" font-weight="600">i(t) × g(t)</text>
<text x="440" y="283" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">what is written</text>

<!-- the sum -->
<circle cx="440" cy="96" r="13" fill="#161B24" stroke="#E8EAF0" stroke-width="1.5"/>
<text x="440" y="102" font-size="16" fill="#E8EAF0" text-anchor="middle" font-weight="700">+</text>

<!-- new cell state -->
<rect x="470" y="74" width="100" height="44" rx="8" fill="#0E1117" stroke="#4FB477" stroke-width="2"/>
<text x="520" y="95" font-size="14" fill="#E8EAF0" text-anchor="middle" font-weight="700">c(t)</text>
<text x="520" y="111" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">state out</text>

<!-- squash before exposing -->
<rect x="470" y="156" width="100" height="40" rx="8" fill="#0E1117" stroke="#4FB477" stroke-width="1.5"/>
<text x="520" y="181" font-size="12" fill="#E8EAF0" text-anchor="middle" font-weight="600">tanh(c(t))</text>

<!-- o(t) x tanh(c(t)) -->
<rect x="400" y="347" width="180" height="46" rx="8" fill="#0E1117" stroke="#CE93D8" stroke-width="1.6"/>
<text x="490" y="368" font-size="12.5" fill="#E8EAF0" text-anchor="middle" font-weight="600">o(t) × tanh(c(t))</text>
<text x="490" y="386" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">what leaves the cell</text>

<!-- hidden state -->
<rect x="620" y="347" width="100" height="46" rx="8" fill="#0E1117" stroke="#CE93D8" stroke-width="2"/>
<text x="670" y="368" font-size="14" fill="#E8EAF0" text-anchor="middle" font-weight="700">h(t)</text>
<text x="670" y="386" font-size="11" fill="#AEB6C6" text-anchor="middle" font-weight="400">hidden out</text>

<!-- ===== equations ===== -->
<line x1="772" y1="76" x2="772" y2="396" stroke="#232A36" stroke-width="1"/>
<text x="790" y="96" font-size="12" fill="#E8EAF0" text-anchor="start" font-weight="700">the six equations</text>
<text x="790" y="122" font-size="11" fill="#EF5350" text-anchor="start" font-weight="600">f(t) = σ(Wf·[h,x] + bf)</text>
<text x="790" y="144" font-size="11" fill="#64B5F6" text-anchor="start" font-weight="600">i(t) = σ(Wi·[h,x] + bi)</text>
<text x="790" y="166" font-size="11" fill="#FFA726" text-anchor="start" font-weight="600">g(t) = tanh(Wg·[h,x] + bg)</text>
<text x="790" y="188" font-size="11" fill="#4FB477" text-anchor="start" font-weight="600">c(t) = f(t)×c(t-1) + i(t)×g(t)</text>
<text x="790" y="210" font-size="11" fill="#CE93D8" text-anchor="start" font-weight="600">o(t) = σ(Wo·[h,x] + bo)</text>
<text x="790" y="232" font-size="11" fill="#E8EAF0" text-anchor="start" font-weight="600">h(t) = o(t)×tanh(c(t))</text>
<text x="790" y="264" font-size="11" fill="#AEB6C6" text-anchor="start" font-weight="400">[h,x] means [h(t-1), x(t)]</text>
<text x="790" y="280" font-size="11" fill="#AEB6C6" text-anchor="start" font-weight="400">σ = logistic, squashes to 0–1</text>
<text x="790" y="296" font-size="11" fill="#AEB6C6" text-anchor="start" font-weight="400">× = element-wise multiply</text>
<text x="790" y="312" font-size="11" fill="#AEB6C6" text-anchor="start" font-weight="400">c is the only path that bypasses every gate</text>
<text x="790" y="328" font-size="11" fill="#AEB6C6" text-anchor="start" font-weight="400">h(t) also carries to the next step</text>
</svg>
