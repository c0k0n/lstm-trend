[server]
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#4FB477"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1E27"
textColor = "#F0F2F6"
font = "Inter"
headingFont = "Inter"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

# Self-hosted Inter (variable weight) served from ./static
[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-var-latin.woff2"
weight = "100 900"
style = "normal"

[browser]
gatherUsageStats = false
