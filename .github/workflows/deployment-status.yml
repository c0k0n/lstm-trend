name: Deployment status

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes, so the badge reflects outages between pushes too.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never run two checks at once (e.g. a push landing on a cron tick).
concurrency:
  group: deployment-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Check live deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed app is reachable
        id: ping
        run: |
          url="https://lstm-trend.streamlit.app"
          # Follow redirects (-L), fail on HTTP errors, 20s timeout.
          if curl -fsSL --max-time 20 "$url" -o /dev/null; then
            echo "status=online" >> "$GITHUB_OUTPUT"
          else
            echo "status=offline" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish badge to gist
        # Pinned to the v1.9.0 commit SHA for supply-chain safety (tags can move).
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910
        with:
          auth: ${{ secrets.GH_PAT }}
          gistID: ${{ secrets.GIST_ID }}
          filename: deployment-status.json
          label: deployment
          message: ${{ steps.ping.outputs.status }}
          color: ${{ steps.ping.outputs.status == 'online' && 'brightgreen' || 'red' }}
