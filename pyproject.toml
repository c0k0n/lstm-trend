[project]
name = "lstm-trend"
version = "0.3.0"
description = "LSTM stock price forecasting with Keras 3 on PyTorch: Streamlit app with deep EDA, baseline comparisons, and honest limitations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "keras>=3.15.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end AppTest tests that exercise the live Streamlit app",
]
filterwarnings = [
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    "ignore:RNN module weights are not part of single contiguous chunk of memory:UserWarning",
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]
