[project]
name = "lstm-trend"
version = "0.1.0"
description = "A Streamlit app that forecasts stock prices with an LSTM neural network, trained on Yahoo Finance data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "starlette>=0.46.0,<1.0",
    "streamlit>=1.61.0",
    "tensorflow>=2.21.0",
    "yfinance>=1.5.2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
