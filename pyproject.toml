[build-system]
requires = ["uv_build >= 0.12.3, <0.13.0"]
build-backend = "uv_build"

[project]
name = "lstm-trend"
version = "0.3.0"
description = "LSTM stock price forecasting with Keras 3 on PyTorch: Streamlit app with deep EDA, baseline comparisons, and limitations."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["lstm", "forecasting", "stocks", "streamlit", "keras", "pytorch", "time-series"]
dependencies = [
    "keras>=3.15.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "yfinance>=1.5.2",
]

[project.urls]
Homepage = "https://lstm-trend.streamlit.app"
Repository = "https://github.com/c0k0n/lstm-trend"

[tool.uv]
package = false